name: Publish @pinkpuma/deck

on:
  push:
    tags:
      - "deck-v*"

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points at main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not an ancestor of origin/main — refusing to publish."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure recent npm CLI
        run: npm install -g npm@latest

      - name: Check version matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#deck-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag deck-v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Test
        run: npm test

      # Fully automated publish via npm Trusted Publishing (OIDC).
      # On npmjs.com → package → Trusted Publisher: allow "npm publish"
      # for workflow publish-deck.yml (tilap/pinkpuma-deck). No NPM_TOKEN.
      - name: Publish
        run: npm publish --access public --provenance
